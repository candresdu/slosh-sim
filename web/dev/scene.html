<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slosh-sim: 3D scene dev page</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 14px system-ui, sans-serif; background: #f4f6f8; color: #1a1d21; }
      body.dark { background: #14181d; color: #e6e9ec; }
      main { max-width: 730px; margin: 0 auto; padding: 12px; }
      #wrap { position: relative; width: 100%; aspect-ratio: 16 / 10; }
      canvas { width: 100%; height: 100%; display: block; border-radius: 6px; touch-action: none; }
      .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
      button { font: inherit; padding: 4px 10px; }
      #err { color: #c92a2a; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 18px">Scene dev page: fig13 playing</h1>
      <div class="bar">
        <button id="theme" type="button" aria-label="Toggle light or dark theme">Dark theme</button>
        <button id="reduced" type="button" aria-pressed="false">Reduced motion: off</button>
        <span id="info"></span>
      </div>
      <div id="wrap"><canvas id="c" aria-label="3D view of the quadrotor with hanging mass"></canvas></div>
      <p id="err" role="alert"></p>
    </main>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
