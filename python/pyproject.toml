[project]
name = "slosh"
version = "0.1.0"
description = "Reference model, controller design and golden traces for the fuel slosh testbed simulation"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "control",
    "matplotlib",
    "jsonschema",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slosh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Block ROS 2 pytest plugins that leak in via PYTHONPATH in ROS containers (harmless elsewhere).
addopts = "-p no:launch_ros -p no:launch_testing -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
