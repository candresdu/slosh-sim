name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install, lint and test
        run: cd python && uv sync && uv run ruff check . && uv run ruff format --check . && uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, check, test, build and size budget
        run: cd web && npm ci && npm run typecheck && npm run lint && npm test && npm run build && npm run size

  e2e:
    name: e2e
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: cd web && npm ci
      - name: Get the installed Playwright version
        id: playwright-version
        run: echo "version=$(cd web && node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Always run: it is quick when the browsers are cached and still installs the system libraries.
      - name: Install browsers and their system dependencies
        run: cd web && npx playwright install --with-deps
      # The Playwright config builds the library and serves it with `vite preview`.
      - name: Run the E2E and accessibility tests
        run: cd web && npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
